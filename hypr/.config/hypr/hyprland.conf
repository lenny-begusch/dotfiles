#
# Hyprland Config
# Ziel: Fenster füllen den Bildschirm komplett aus, kein "Schweben"
# Farbschema: dunkles Grau + Blau
#

# ---------------------------
# Monitore (anpassen falls nötig)
# ---------------------------
monitor=,preferred,auto,1

# ---------------------------
# Autostart
# ---------------------------
exec-once = waybar
exec-once = hyprpaper
exec-once = dunst
exec-once = swayidle -w timeout 300 'swaylock -f' timeout 600 'hyprctl dispatch dpms off' resume 'hyprctl dispatch dpms on'

# ---------------------------
# Umgebungsvariablen
# ---------------------------
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# ---------------------------
# INPUT
# ---------------------------
input {
    kb_layout = de
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}

# ---------------------------
# GENERAL
# WICHTIGSTER TEIL: keine Abstände -> Fenster füllen den Screen
# ---------------------------
general {
    gaps_in = 0          # Abstand zwischen Fenstern
    gaps_out = 0         # Abstand zum Bildschirmrand
    border_size = 2

    # Randfarben: dunkles Blau-Grau (inaktiv) / kräftiges Blau (aktiv)
    col.active_border   = rgba(3d7fddee) rgba(1e3a5fee) 45deg
    col.inactive_border = rgba(2a2e35aa)

    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

# ---------------------------
# DECORATION
# ---------------------------
decoration {
    rounding = 4   # auf 0 setzen für komplett eckige, "randlose" Optik

    blur {
        enabled = true
        size = 4
        passes = 2
        new_optimizations = true
        ignore_opacity = true
    }

    shadow {
        enabled = true
        range = 12
        render_power = 2
        color = rgba(00000088)
    }

    active_opacity = 1.0
    inactive_opacity = 0.95
}

# ---------------------------
# ANIMATIONEN (dezent, kein "Reinschweben")
# ---------------------------
animations {
    enabled = true

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = linear,0,0,1,1

    animation = windows, 1, 3, easeOutQuint
    animation = windowsOut, 1, 3, linear, popin 80%
    animation = border, 1, 5, linear
    animation = fade, 1, 3, linear
    animation = workspaces, 1, 4, easeOutQuint, slide
}

# ---------------------------
# LAYOUT: DWINDLE
# no_gaps_when_only sorgt zusätzlich dafür, dass ein einzelnes
# Fenster wirklich 100% ohne jeden Rand einnimmt
# ---------------------------
dwindle {
    pseudotile = false        # false = kein "Floating-Feeling" beim Tiling
    preserve_split = true
    no_gaps_when_only = true
}

master {
    new_status = master
    no_gaps_when_only = true
}

# ---------------------------
# MISC
# ---------------------------
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = rgb(1a1c20)
}

# ---------------------------
# WINDOW RULES
# Alles standardmäßig tiled (gemaxt), nur explizite Ausnahmen floaten
# ---------------------------
windowrulev2 = tile, class:^(.*)$
windowrulev2 = float, class:^(pavucontrol|nm-connection-editor|blueman-manager|file_progress|confirm|dialog)$
windowrulev2 = size 800 600, class:^(pavucontrol)$
windowrulev2 = center, class:^(pavucontrol|nm-connection-editor)$

# ---------------------------
# KEYBINDINGS
# ---------------------------
$mainMod = SUPER
$terminal = kitty
$menu = wofi --show drun

bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, dolphin
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo,
bind = $mainMod, F, fullscreen,
bind = $mainMod, J, togglesplit,

# Fokus wechseln
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Lautstärke / Helligkeit
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl set 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl set 10%-
